name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:verify
      - name: Verify the production Turbopack build path
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Wait for the exact Vercel Production deployment
        run: npm run release:wait-production
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Run fixed production smoke checks
        run: npm run release:smoke
